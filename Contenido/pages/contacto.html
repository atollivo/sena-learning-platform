<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Contacto | SENA APP</title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="../CSS/styles_global.css">

    <link rel="stylesheet"
    href="../CSS/contacto.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <nav class="navbar">

            <h1 class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                SENA APP
            </h1>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="tareas.html">
                        Tareas
                    </a>
                </li>

                <li>
                    <a href="progreso.html">
                        Progreso
                    </a>
                </li>

                <li>
                    <a class="active" href="contacto.html">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- CONTENIDO -->
    <main class="container">

        <!-- TITULO -->
        <section class="contact-header">

            <h2>
                Contáctanos
            </h2>

            <p>
                Si tienes dudas o problemas
                puedes comunicarte con soporte.
            </p>

        </section>

        <!-- CONTACTO -->
        <section class="contact-section">

            <!-- FORMULARIO -->
            <form class="contact-form">

                <label>
                    Nombre
                </label>

                <input
                type="text"
                placeholder="Ingresa tu nombre">

                <label>
                    Correo
                </label>

                <input
                type="email"
                placeholder="Ingresa tu correo">

                <label>
                    Mensaje
                </label>

                <textarea
                placeholder="Escribe tu mensaje"></textarea>

                <button class="btn">
                    Enviar
                </button>

            </form>

            <!-- INFORMACIÓN -->
            <div class="contact-info">

                <div class="info-card">

                    <i class="fa-solid fa-envelope"></i>

                    <h3>
                        Correo
                    </h3>

                    <p>
                        soporte@senaapp.com
                    </p>

                </div>

                <div class="info-card">

                    <i class="fa-solid fa-phone"></i>

                    <h3>
                        Teléfono
                    </h3>

                    <p>
                        +57 300 000 0000
                    </p>

                </div>

                <div class="info-card">

                    <i class="fa-solid fa-clock"></i>

                    <h3>
                        Horario
                    </h3>

                    <p>
                        Lunes a Viernes
                        8:00 AM - 6:00 PM
                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <p>
            © 2026 SENA APP
        </p>

    </footer>

</body>

</html>
