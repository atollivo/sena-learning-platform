<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Progreso | SENA APP</title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="../CSS/styles_global.css">

    <link rel="stylesheet"
    href="../CSS/progreso.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <nav class="navbar">

            <h1 class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                SENA APP
            </h1>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="tareas.html">
                        Tareas
                    </a>
                </li>

                <li>
                    <a class="active" href="progreso.html">
                        Progreso
                    </a>
                </li>

                <li>
                    <a href="contacto.html">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- CONTENIDO -->
    <main class="container">

        <!-- TITULO -->
        <section class="progress-header">

            <h2>
                Progreso Académico
            </h2>

            <p>
                Consulta el avance de las
                competencias y actividades.
            </p>

        </section>

        <!-- PROGRESO -->
        <section class="progress-section">

            <!-- ITEM -->
            <div class="progress-card">

                <div class="progress-info">

                    <span>
                        HTML
                    </span>

                    <span>
                        90%
                    </span>

                </div>

                <div class="bar">

                    <div class="fill html"></div>

                </div>

            </div>

            <!-- ITEM -->
            <div class="progress-card">

                <div class="progress-info">

                    <span>
                        CSS
                    </span>

                    <span>
                        80%
                    </span>

                </div>

                <div class="bar">

                    <div class="fill css"></div>

                </div>

            </div>

            <!-- ITEM -->
            <div class="progress-card">

                <div class="progress-info">

                    <span>
                        GitHub
                    </span>

                    <span>
                        70%
                    </span>

                </div>

                <div class="bar">

                    <div class="fill github"></div>

                </div>

            </div>

            <!-- ITEM -->
            <div class="progress-card">

                <div class="progress-info">

                    <span>
                        Responsive Design
                    </span>

                    <span>
                        75%
                    </span>

                </div>

                <div class="bar">

                    <div class="fill responsive"></div>

                </div>

            </div>

        </section>

        <!-- RESUMEN -->
        <section class="summary">

            <div class="summary-card">

                <i class="fa-solid fa-check"></i>

                <h3>
                    12
                </h3>

                <p>
                    Tareas completadas
                </p>

            </div>

            <div class="summary-card">

                <i class="fa-solid fa-clock"></i>

                <h3>
                    3
                </h3>

                <p>
                    Pendientes
                </p>

            </div>

            <div class="summary-card">

                <i class="fa-solid fa-chart-line"></i>

                <h3>
                    80%
                </h3>

                <p>
                    Rendimiento
                </p>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <p>
            © 2026 SENA APP
        </p>

    </footer>

</body>
</html>
